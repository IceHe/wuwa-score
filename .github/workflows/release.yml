name: Publish Windows ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate the release version
        shell: bash
        run: |
          release_date=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          next_revision=$(git tag --list "v${release_date}" "v${release_date}.*" |
            awk -F. '
              NF == 3 && next_revision < 1 { next_revision = 1 }
              NF == 4 && $4 ~ /^(0|[1-9][0-9]*)$/ && $4 >= next_revision {
                next_revision = $4 + 1
              }
              END { print next_revision + 0 }
            ')
          version="$release_date"
          if (( next_revision > 0 )); then
            version="${version}.${next_revision}"
          fi
          printf 'RELEASE_VERSION=%s\nPACKAGE_NAME=wuwa-score-v%s-windows-x64\n' \
            "$version" "$version" >> "$GITHUB_ENV"
          echo "Release version: $version"

      - name: Package the Windows distribution
        shell: bash
        run: |
          git archive --format=zip --prefix="${PACKAGE_NAME}/" \
            --output="${PACKAGE_NAME}.zip" HEAD -- \
            LICENSE.txt NOTICE.md README.md docs install.cmd main.py requirements.txt scripts start.cmd wuwa_score

      - name: Publish the release and attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${RELEASE_VERSION}" "${PACKAGE_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "wuwa-score ${RELEASE_VERSION}" \
            --latest \
            --generate-notes --notes "下载 Assets 下的 ${PACKAGE_NAME}.zip，解压后双击 install.cmd 安装，再双击 start.cmd 启动。"
